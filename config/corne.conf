# Keep the name your PC/Mac/ThinkPad already know
CONFIG_ZMK_KEYBOARD_NAME="Nice_Corne_Oled"

# OLED displays
CONFIG_ZMK_DISPLAY=y

# Mouse keys (MOUSE layer)
CONFIG_ZMK_POINTING=y

# Report both halves' battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Sleep after 30 min idle to save battery (any key wakes it)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
